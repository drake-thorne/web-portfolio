<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Resume – Drake Thorne</title>
  <meta name="description" content="View Drake Thorne's resume – Network Platform Engineer specializing in networking and DevOps.">
  <link rel="icon" href="/src/images/favicon.png" sizes="any">
  <link rel="apple-touch-icon" href="/src/images/favicon.png">
  <meta name="theme-color" content="#525659">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #525659; }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <embed src="/resume-file/resume.pdf" type="application/pdf" class="pdf-frame">

  <script>
    // Mobile browsers don't support inline PDF embed.
    // Redirect to the raw PDF — their native viewer handles it perfectly.
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints > 1 && window.innerWidth < 1024)) {
      window.location.replace('/resume-file/resume.pdf');
    }
  </script>
</body>

</html>
