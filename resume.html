<!DOCTYPE html>
<html lang="en">
<head>
  <title>Resume – Drake Thorne</title>
  <link rel="icon" href="/src/images/favicon.png" sizes="any">
  <link rel="apple-touch-icon" href="/src/images/favicon.png">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --accent: #a855f7;
      --accent-light: #c084fc;
      --accent-dim: rgba(168, 85, 247, 0.08);
      --accent-border: rgba(168, 85, 247, 0.25);
      --bg: #0c0c0c;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-muted: #666666;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'Outfit', sans-serif;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); }
    html { overflow-y: scroll; }
    html { scrollbar-gutter: stable; }

    /* ── Top bar — identical to main site ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 2000;
      padding: 1rem 1.5rem;
      background: rgba(12, 12, 12, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    nav {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: opacity 0.2s var(--ease-out-expo);
    }

    .logo:hover { opacity: 0.8; }

    .logo img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }

    .logo span {
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.4s var(--ease-out-expo);
      cursor: pointer;
      border: none;
    }

    .btn-ghost {
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border-hover);
    }

    .btn-ghost:hover {
      color: var(--accent);
      border-color: var(--accent-border);
      background: var(--accent-dim);
    }

    .btn-accent {
      background: var(--accent);
      color: #0c0c0c;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.25);
    }

    .btn-accent:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(168, 85, 247, 0.35);
    }

    /* ── Viewer ── */
    .viewer {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .mobile-prompt {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1.25rem;
      padding: 2rem;
      text-align: center;
    }

    .mobile-prompt i {
      font-size: 3rem;
      color: var(--accent);
      opacity: 0.8;
    }

    .mobile-prompt h2 {
      font-family: var(--font-body);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .mobile-prompt p {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .viewer iframe { display: none; }
      .mobile-prompt { display: flex; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="/" class="logo">
        <img src="/src/images/favicon.png" alt="Logo">
        <span>drakethorne</span>
      </a>
      <div class="nav-actions">
        <a href="/" class="btn btn-ghost">
          <i class="fas fa-arrow-left"></i> Back
        </a>
        <a href="/resume/resume.pdf" download class="btn btn-accent">
          <i class="fas fa-download"></i> Download
        </a>
      </div>
    </nav>
  </header>

  <div class="viewer">
    <iframe src="/resume/resume.pdf#toolbar=0&navpanes=0"></iframe>
    <div class="mobile-prompt">
      <i class="fas fa-file-alt"></i>
      <h2>View Resume</h2>
      <p>PDF preview isn't supported on mobile. Download it to view the full resume.</p>
      <a href="/resume/resume.pdf" download class="btn btn-accent">
        <i class="fas fa-download"></i> Download PDF
      </a>
    </div>
  </div>

</body>
</html>
