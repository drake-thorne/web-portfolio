<!DOCTYPE html>
<html lang="en">
<head>
  <title>Resume – Drake Thorne</title>
  <link rel="icon" href="/src/images/favicon.png" sizes="any">
  <link rel="apple-touch-icon" href="/src/images/favicon.png">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --accent: #a855f7;
      --bg: #0c0c0c;
      --text-muted: #666;
      --border: rgba(255,255,255,0.06);
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'Outfit', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; background: var(--bg); }

    /* ── Top bar ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(12,12,12,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }

    .topbar-left img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .topbar-left span {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: #f5f5f5;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn-ghost {
      color: #a3a3a3;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn-ghost:hover {
      color: #f5f5f5;
      border-color: rgba(255,255,255,0.2);
    }

    .btn-accent {
      background: var(--accent);
      color: #0c0c0c;
      font-weight: 600;
    }

    .btn-accent:hover {
      box-shadow: 0 4px 20px rgba(168,85,247,0.35);
      transform: translateY(-1px);
    }

    /* ── Viewer area ── */
    .viewer {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
    }

    /* Desktop: native iframe */
    .viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Mobile: hide iframe, show download prompt */
    .mobile-prompt {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1.25rem;
      padding: 2rem;
      text-align: center;
    }

    .mobile-prompt i {
      font-size: 3rem;
      color: var(--accent);
      opacity: 0.8;
    }

    .mobile-prompt h2 {
      font-family: var(--font-body);
      font-size: 1.2rem;
      font-weight: 600;
      color: #f5f5f5;
    }

    .mobile-prompt p {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .viewer iframe { display: none; }
      .mobile-prompt { display: flex; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/" class="topbar-left">
      <img src="/src/images/favicon.png" alt="Logo">
      <span>drakethorne</span>
    </a>
    <div class="topbar-right">
      <a href="/" class="btn btn-ghost">
        <i class="fas fa-arrow-left"></i> Back
      </a>
      <a href="/resume/resume.pdf" download class="btn btn-accent">
        <i class="fas fa-download"></i> Download
      </a>
    </div>
  </div>

  <div class="viewer">
    <iframe src="/resume/resume.pdf#toolbar=0&navpanes=0"></iframe>
    <div class="mobile-prompt">
      <i class="fas fa-file-alt"></i>
      <h2>View Resume</h2>
      <p>PDF preview isn't supported on mobile. Download it to view the full resume.</p>
      <a href="/resume/resume.pdf" download class="btn btn-accent">
        <i class="fas fa-download"></i> Download PDF
      </a>
      <a href="https://drive.google.com/YOUR_LINK_HERE" target="_blank" class="btn btn-ghost">
        <i class="fab fa-google"></i> Open in Google Drive
      </a>
    </div>
  </div>

</body>
</html>
