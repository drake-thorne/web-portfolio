<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Drake Thorne</title>

    <!-- Set theme before first paint to avoid a flash of the wrong palette -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'light' || stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) {}
        })();
    </script>

    <link rel="icon" href="/src/images/favicon.png" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/src/images/favicon.png">
    <link rel="apple-touch-icon" href="/src/images/favicon.png">
    <meta name="theme-color" content="#0c0c0c">

    <meta name="description" content="Get in touch with Drake Thorne — send a message directly.">
    <meta property="og:title" content="Contact - Drake Thorne">
    <meta property="og:description" content="Get in touch with Drake Thorne — send a message directly.">
    <meta property="og:url" content="https://drakethorne.com/contact">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Contact - Drake Thorne">
    <meta name="twitter:description" content="Get in touch with Drake Thorne — send a message directly.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
</head>

<body>
    <canvas id="bg-canvas"></canvas>
    <div class="scroll-progress"></div>

    <div class="container">
        <header>
            <nav>
                <a href="https://drakethorne.com" class="logo">
                    <span class="logo-user">drake</span><span class="logo-at">@</span><span class="logo-host">thorne</span><span class="logo-path">:~$</span>
                    <span class="cursor-blink"></span>
                </a>
                <ul>
                    <li><span class="nav-soon">Blog <span class="nav-soon-badge">soon</span></span></li>
                    <li><span class="nav-soon">Projects <span class="nav-soon-badge">soon</span></span></li>
                    <li><a href="/contact">Contact</a></li>
                </ul>

                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
                        <path
                            d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor"
                            stroke-width="1.8" stroke-linejoin="round" />
                    </svg>
                </button>

                <div class="nav-divider"></div>
                <div class="pages-dropdown-wrapper" id="pagesDropdown">
                    <button class="pages-btn" id="pagesBtn" aria-haspopup="true" aria-expanded="false">
                        menu
                        <svg class="pages-chevron" width="10" height="10" viewBox="0 0 12 12" fill="none"
                            aria-hidden="true">
                            <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>

                    <div class="pages-menu" id="pagesMenu" role="menu">
                        <a href="/" class="pages-menu-item" role="menuitem">
                            <span class="pages-menu-label">home</span>
                        </a>
                        <div class="pages-menu-item pages-menu-item--soon" role="menuitem" aria-disabled="true">
                            <span class="pages-menu-label">blog</span>
                            <span class="pages-soon-badge">soon</span>
                        </div>
                        <div class="pages-menu-item pages-menu-item--soon" role="menuitem" aria-disabled="true">
                            <span class="pages-menu-label">projects</span>
                            <span class="pages-soon-badge">soon</span>
                        </div>
                        <a href="/contact" class="pages-menu-item" role="menuitem">
                            <span class="pages-menu-label">contact</span>
                        </a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="blog-main">
            <section class="page-hero reveal visible">
                <p class="prompt"><span class="sigil">$</span>mail --compose</p>
                <h1>Let's talk</h1>
                <p class="blog-description">Drop a message below, or use one of the direct links.</p>
            </section>

            <section class="reveal visible" style="margin-bottom: var(--spacing-lg);">
                <div class="contact-icons">
                    <a href="https://github.com/drake-thorne" target="_blank" rel="noopener noreferrer"
                        class="contact-icon" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                        <span class="contact-icon-label">github</span>
                    </a>
                    <a href="https://linkedin.com/in/drakethorne" target="_blank" rel="noopener noreferrer"
                        class="contact-icon" aria-label="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                        <span class="contact-icon-label">linkedin</span>
                    </a>
                    <a href="mailto:contact@drakethorne.com" class="contact-icon" aria-label="Email">
                        <i class="fas fa-envelope"></i>
                        <span class="contact-icon-label">email</span>
                    </a>
                    <a href="/resume" target="_blank" rel="noopener noreferrer" class="contact-icon"
                        aria-label="Resume">
                        <i class="fas fa-file-alt"></i>
                        <span class="contact-icon-label">resume</span>
                    </a>
                </div>
            </section>

            <section class="contact-form-section reveal visible">
                <div class="term-window">
                    <div class="term-titlebar">
                        <span class="term-dot term-dot--red"></span>
                        <span class="term-dot term-dot--yellow"></span>
                        <span class="term-dot term-dot--green"></span>
                        <span class="term-titlebar-label">new-message.txt</span>
                    </div>
                    <div class="term-body">
                        <form class="contact-form" action="https://formsubmit.co/contact@drakethorne.com"
                            method="POST">
                            <input type="hidden" name="_subject" value="New message from drakethorne.com">
                            <input type="hidden" name="_captcha" value="true">
                            <input type="hidden" name="_next" value="https://drakethorne.com/thanks">

                            <div class="form-group">
                                <label for="name">name</label>
                                <input type="text" id="name" name="name" required placeholder="your name">
                            </div>

                            <div class="form-group">
                                <label for="email">email</label>
                                <input type="email" id="email" name="email" required placeholder="you@example.com">
                            </div>

                            <div class="form-group">
                                <label for="message">message</label>
                                <textarea id="message" name="message" rows="6" required
                                    placeholder="what's on your mind?"></textarea>
                            </div>

                            <button type="submit" class="contact-submit">
                                <span>send message</span>
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <div class="status-bar">
                <span class="status-live">drakethorne.com</span>
                <span>&copy; 2026 Drake Thorne</span>
            </div>
        </footer>
    </div>

    <script src="src/js/script.js"></script>
</body>

</html>
